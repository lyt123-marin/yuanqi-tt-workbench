<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>元气tt · 工作台</title>
<style>
  :root {
    --bg-grad-1: #FFD9DE;
    --bg-grad-2: #FFE4E6;
    --bg-grad-3: #FFF0F1;
    --pink-50: #FFF0F1;
    --pink-100: #FFE0E4;
    --pink-200: #FFC9CF;
    --pink-300: #FFA9B2;
    --pink-400: #FF8A95;
    --pink-500: #F47281;
    --pink-600: #E25A6A;
    --pink-700: #C84A5A;
    --text-1: #2E2A2B;
    --text-2: #6B5F60;
    --text-3: #A89B9C;
    --card-bg: #FFFFFF;
    --card-border: #FCE5E8;
    --shadow-sm: 0 4px 14px rgba(244, 114, 129, 0.08);
    --shadow-md: 0 8px 24px rgba(244, 114, 129, 0.12);
    --green: #6FCF97;
    --orange: #F2A65A;
    --blue: #7AA8E0;
    --purple: #B19CD9;
    --yellow: #F5C45E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 45%, var(--bg-grad-3) 100%);
    color: var(--text-1);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 顶部状态栏 ========== */
  .status-bar {
    height: 44px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-1);
    position: relative;
  }
  .status-bar .left { display: flex; align-items: center; gap: 8px; }
  .status-bar .brand { font-size: 17px; font-weight: 700; }
  .status-bar .brand .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--pink-500); margin-left: 2px;
  }
  .status-bar .center {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-weight: 600; font-size: 14px; color: var(--text-2);
  }
  .status-bar .right { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
  .status-bar .right .icon { font-size: 14px; }
  .status-bar .battery {
    width: 26px; height: 12px; border: 1.2px solid var(--text-2);
    border-radius: 3px; position: relative; padding: 1px;
  }
  .status-bar .battery::after {
    content: ''; position: absolute; right: -3px; top: 3px;
    width: 2px; height: 4px; background: var(--text-2); border-radius: 0 1px 1px 0;
  }
  .status-bar .battery .level { display: block; height: 100%; background: var(--text-2); border-radius: 1px; }

  /* ========== 主容器 ========== */
  .app { display: flex; height: calc(100% - 44px); position: relative; }

  /* ========== 左侧侧栏 ========== */
  .sidebar {
    width: 78px;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-right: 1px solid rgba(255, 200, 205, 0.4);
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 0; gap: 6px;
    overflow-y: auto;
  }
  .nav-item {
    width: 64px; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 8px 4px; border-radius: 14px;
    cursor: pointer; transition: all .25s;
    position: relative;
  }
  .nav-item .icon-wrap {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; transition: all .25s;
    font-size: 26px;
  }
  .nav-item .label { font-size: 11px; color: var(--text-2); font-weight: 500; }
  .nav-item.active .icon-wrap {
    background: #FFFFFF; box-shadow: 0 4px 14px rgba(244, 114, 129, 0.25);
  }
  .nav-item.active .label { color: var(--pink-600); font-weight: 600; }
  .nav-item .badge {
    position: absolute; top: 4px; right: 4px;
    background: var(--pink-500); color: #fff;
    font-size: 9px; padding: 1px 5px; border-radius: 8px;
    min-width: 16px; text-align: center;
  }

  /* ========== 主内容区 ========== */
  .main {
    flex: 1; overflow-y: auto; padding: 8px 18px 30px;
    scrollbar-width: thin; scrollbar-color: var(--pink-200) transparent;
  }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 2px; }

  /* ========== 通用卡片 ========== */
  .card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--card-border);
    margin-bottom: 14px;
  }
  .card-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-weight: 600;
  }
  .card-header .emoji { font-size: 18px; }
  .card-title { font-size: 15px; color: var(--text-1); }
  .card-action {
    margin-left: auto; font-size: 12px; color: var(--pink-500);
    padding: 4px 10px; border-radius: 12px;
    background: var(--pink-50); cursor: pointer;
    border: none; font-weight: 500;
  }
  .card-section { margin-top: 10px; }
  .section-title {
    font-size: 12px; color: var(--text-3); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title::before {
    content: ''; display: inline-block; width: 3px; height: 12px;
    background: var(--pink-400); border-radius: 2px;
  }

  /* ========== 网格小卡 ========== */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini-card {
    background: linear-gradient(135deg, #FFF8F8 0%, #FFFFFF 100%);
    border-radius: 14px; padding: 12px;
    border: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 10px;
  }
  .mini-card .ic {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .mini-card .v { font-size: 20px; font-weight: 700; color: var(--text-1); }
  .mini-card .l { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .ic-pink { background: linear-gradient(135deg, #FFD9DE, #FFC0C8); }
  .ic-green { background: linear-gradient(135deg, #D4F1E1, #B5E5CB); }
  .ic-blue { background: linear-gradient(135deg, #DCE8FA, #C2D6F1); }
  .ic-orange { background: linear-gradient(135deg, #FDE3CB, #F8CDA0); }
  .ic-yellow { background: linear-gradient(135deg, #FCEFC4, #F5DC92); }
  .ic-purple { background: linear-gradient(135deg, #E5DCEF, #CFBCE3); }

  /* ========== 进度条 ========== */
  .progress {
    width: 100%; height: 10px; background: var(--pink-50);
    border-radius: 6px; overflow: hidden; margin: 6px 0;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-400), var(--pink-500));
    border-radius: 6px;
    transition: width .6s ease;
  }

  /* ========== 列表项 ========== */
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--card-border);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .li-emoji { font-size: 22px; }
  .list-item .li-info { flex: 1; min-width: 0; }
  .list-item .li-title { font-size: 13px; color: var(--text-1); font-weight: 500; }
  .list-item .li-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .list-item .li-right { text-align: right; }
  .list-item .li-amount { font-size: 14px; font-weight: 600; color: var(--pink-600); }
  .list-item .li-time { font-size: 11px; color: var(--text-3); }
  .li-del {
    border: none; background: var(--pink-50); color: var(--pink-500);
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 12px; cursor: pointer; flex-shrink: 0;
  }

  /* ========== 输入 & 按钮 ========== */
  .input, .select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--card-border); background: var(--pink-50);
    font-size: 13px; color: var(--text-1);
    font-family: inherit;
  }
  .input:focus, .select:focus { outline: none; border-color: var(--pink-300); }
  .btn {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--pink-500), var(--pink-400));
    color: #fff; font-weight: 600; font-size: 13px;
    cursor: pointer; transition: transform .15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-ghost {
    background: var(--pink-50); color: var(--pink-600);
    border: 1px solid var(--pink-200);
  }
  .form-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .form-row .input { flex: 1; min-width: 100px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 10px;
    background: var(--pink-50); color: var(--pink-600);
    font-size: 11px; margin: 4px 4px 0 0;
  }
  .chip .x { cursor: pointer; opacity: 0.6; }

  /* ========== 倒计时/大数字展示 ========== */
  .big-num {
    font-size: 36px; font-weight: 800;
    background: linear-gradient(135deg, var(--pink-500), var(--pink-300));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  .big-num.small { font-size: 28px; }
  .sub-line { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* ========== 弹窗 ========== */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 18px; padding: 20px;
    width: 100%; max-width: 380px; max-height: 80vh;
    overflow-y: auto; box-shadow: var(--shadow-md);
  }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions .btn { flex: 1; }

  /* ========== 标签 / Tab ========== */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px; border-radius: 10px; font-size: 12px;
    background: var(--pink-50); color: var(--text-2);
    cursor: pointer; border: none; font-weight: 500;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--pink-500), var(--pink-400));
    color: #fff;
  }

  /* ========== 视图切换 ========== */
  .view { display: none; }
  .view.active { display: block; }

  /* ========== 单词卡 ========== */
  .word-item {
    background: linear-gradient(135deg, #FFFAFA 0%, #FFF5F6 100%);
    border: 1px solid var(--card-border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .word-item .w { font-size: 15px; font-weight: 700; color: var(--text-1); }
  .word-item .p { font-size: 11px; color: var(--text-3); margin-left: 8px; font-family: "Times New Roman", serif; }
  .word-item .pos { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--pink-100); color: var(--pink-700); margin-left: 4px; }
  .word-item .mean { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .word-item .col { font-size: 11px; color: var(--text-3); margin-top: 2px; font-style: italic; }

  /* ========== 时间线 ========== */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before {
    content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px;
    width: 2px; background: var(--pink-200);
  }
  .timeline-item { position: relative; margin-bottom: 10px; }
  .timeline-item::before {
    content: ''; position: absolute; left: -16px; top: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink-500); border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--pink-300);
  }
  .timeline-item .ti-date { font-size: 11px; color: var(--text-3); }
  .timeline-item .ti-title { font-size: 13px; color: var(--text-1); font-weight: 500; }
  .timeline-item .ti-sub { font-size: 11px; color: var(--text-2); margin-top: 2px; }

  /* ========== 仪表盘分项标题 ========== */
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  .stat-row .lbl { font-size: 12px; color: var(--text-2); }
  .stat-row .val { font-size: 14px; font-weight: 600; color: var(--text-1); }

  /* ========== 圆环进度 ========== */
  .ring { position: relative; width: 90px; height: 90px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-text {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--pink-600);
  }

  /* ========== 文章段落 ========== */
  .article {
    background: linear-gradient(135deg, #FFFAFA 0%, #FFF5F6 100%);
    border: 1px solid var(--card-border);
    border-radius: 12px; padding: 14px;
    line-height: 1.8; font-size: 13px; color: var(--text-1);
  }
  .article .highlight {
    background: linear-gradient(transparent 60%, #FFD9DE 60%);
    font-weight: 600; color: var(--pink-700);
    padding: 0 2px;
  }
  .article p { margin-bottom: 8px; }
  .article .cn-trans {
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.7;
    margin-bottom: 14px;
    padding-left: 10px;
    border-left: 2px solid var(--pink-200);
  }
  .article h4 { color: var(--pink-600); margin: 8px 0 4px; font-size: 14px; }

  /* ========== 比例条 ========== */
  .ratio-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .ratio-seg { height: 100%; }
  .seg-1 { background: var(--pink-500); }
  .seg-2 { background: var(--orange); }
  .seg-3 { background: var(--green); }
  .seg-4 { background: var(--blue); }
  .seg-5 { background: var(--purple); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .legend .item { font-size: 11px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 2px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* 庆祝图标 */
  .heart-beat { animation: hb 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes hb {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .cat-img {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, #FFE0C2, #FFD0A0);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 8px;
    border: 3px solid #fff; box-shadow: 0 4px 12px rgba(242, 166, 90, 0.3);
  }
</style>

/* ============================================================
   1. 生存日记（自动记账）
============================================================ */
function fmtToday(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function startOfWeek(d) {
  const day = d.getDay() || 7;
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - day + 1);
  return x;
}
function startOfMonth(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(1); return x; }
function startOfYear(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setMonth(0,1); return x; }

function summarize(expenses) {
  const now = new Date();
  const today0 = new Date(now); today0.setHours(0,0,0,0);
  const week0 = startOfWeek(now);
  const month0 = startOfMonth(now);
  const year0 = startOfYear(now);
  const sum = (arr) => arr.reduce((a, b) => a + b.amount, 0);
  const today = expenses.filter(e => e.time >= today0.getTime());
  const week = expenses.filter(e => e.time >= week0.getTime());
  const month = expenses.filter(e => e.time >= month0.getTime());
  const year = expenses.filter(e => e.time >= year0.getTime());
  return { today, week, month, year, all: expenses,
    todayTotal: sum(today), weekTotal: sum(week), monthTotal: sum(month),
    yearTotal: sum(year), total: sum(expenses)
  };
}
function categoryRatio(list) {
  const map = {};
  list.forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount; });
  const total = Object.values(map).reduce((a,b) => a+b, 0);
  const arr = Object.entries(map).map(([k, v]) => ({ name: k, value: v, pct: total ? (v/total*100) : 0 }));
  arr.sort((a,b) => b.value - a.value);
  return arr;
}

/* ============================================================
   经期记录
============================================================ */
function viewPeriod() {
  const periods = [...DATA.periods].sort((a, b) => b.startDate.localeCompare(a.startDate));
  // 计算周期
  const sorted = [...DATA.periods].sort((a, b) => a.startDate.localeCompare(b.startDate));
  let avgCycle = 0, avgDays = 0, cycleCount = 0, daysCount = 0;
  for (let i = 1; i < sorted.length; i++) {
    const cycle = Math.round((new Date(sorted[i].startDate) - new Date(sorted[i-1].startDate)) / 86400000);
    if (cycle > 0 && cycle < 60) { avgCycle += cycle; cycleCount++; }
    const prev = sorted[i-1];
    if (prev.endDate) {
      const dur = Math.round((new Date(prev.endDate) - new Date(prev.startDate)) / 86400000) + 1;
      if (dur > 0 && dur < 15) { avgDays += dur; daysCount++; }
    }
  }
  avgCycle = cycleCount ? Math.round(avgCycle / cycleCount) : 0;
  avgDays = daysCount ? Math.round(avgDays / daysCount) : 0;

  // 预测下次
  let nextPredict = '';
  if (periods.length > 0 && avgCycle > 0) {
    const last = periods[0];
    const nextDate = new Date(last.startDate);
    nextDate.setDate(nextDate.getDate() + avgCycle);
    nextPredict = fmtDate(nextDate.getTime());
  }
  const daysUntilNext = nextPredict ? daysUntil(nextPredict) : null;

  return `
    <div class="card" style="background:linear-gradient(135deg, #FFE4EC 0%, #FFF5F8 100%); text-align:center;">
      <div style="font-size:28px;">🌸</div>
      ${nextPredict ? `
        <div class="big-num small">${daysUntilNext >= 0 ? daysUntilNext : '已过' + (-daysUntilNext)}</div>
        <div class="sub-line">${daysUntilNext >= 0 ? '天后预计来月经' : '天前预计来月经（可能已推迟）'}</div>
        <div class="sub-line" style="margin-top:2px;">预计日期 ${nextPredict}</div>
      ` : `
        <div class="big-num small">--</div>
        <div class="sub-line">记录至少2次经期后可预测</div>
      `}
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📊</span>
        <span class="card-title">周期概览</span>
      </div>
      <div class="grid-2">
        <div class="mini-card">
          <div class="ic ic-pink">📅</div>
          <div><div class="v">${avgCycle || '--'} <span style="font-size:12px;">天</span></div><div class="l">平均周期</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ic-purple">⏱️</div>
          <div><div class="v">${avgDays || '--'} <span style="font-size:12px;">天</span></div><div class="l">平均经期</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ic-orange">📝</div>
          <div><div class="v">${DATA.periods.length}</div><div class="l">记录次数</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ic-blue">🔮</div>
          <div><div class="v">${nextPredict ? nextPredict.slice(5) : '--'}</div><div class="l">下次预测</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📋</span>
        <span class="card-title">经期历史</span>
        <button class="card-action" onclick="addPeriod()">+ 记录</button>
      </div>
      <div class="timeline">
        ${periods.length === 0 ? `<div class="sub-line" style="text-align:center; padding:14px 0;">暂无记录，点右上角开始记录 🌸</div>` :
          periods.map(p => {
            const start = p.startDate;
            const end = p.endDate ? p.endDate : '进行中';
            let dur = '';
            if (p.endDate) {
              const d = Math.round((new Date(p.endDate) - new Date(p.startDate)) / 86400000) + 1;
              dur = d + '天';
            } else {
              const d = Math.round((Date.now() - new Date(p.startDate)) / 86400000) + 1;
              dur = '第' + d + '天';
            }
            return `
            <div class="timeline-item">
              <div class="ti-date">${start} → ${end} · ${dur}</div>
              <div class="ti-title">${p.note || '经期记录'}</div>
              <button class="li-del" style="margin-top:4px;" onclick="delPeriod(${p.id})">删除</button>
            </div>
          `}).join('')
        }
      </div>
    </div>
  `;
}

   3. 体重记录
============================================================ */
function viewWeight() {
  const ws = [...DATA.weights].sort((a,b) => a.date.localeCompare(b.date));
  const latest = ws[ws.length - 1];
  const first = ws[0];
  const change = latest && first ? (latest.value - first.value).toFixed(1) : '0.0';
  const diff = latest ? (latest.value - DATA.weightGoal).toFixed(1) : '0.0';
  // 简易折线 SVG
  const w = 320, h = 100, pad = 16;
  let path = '', points = [];
  if (ws.length > 1) {
    const min = Math.min(...ws.map(x => x.value), DATA.weightGoal) - 0.5;
    const max = Math.max(...ws.map(x => x.value), DATA.weightGoal) + 0.5;
    const range = max - min || 1;
    const step = (w - pad*2) / (ws.length - 1);
    points = ws.map((p, i) => ({
      x: pad + i * step,
      y: h - pad - (p.value - min) / range * (h - pad*2),
      v: p.value, d: p.date
    }));
    path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  }
  return `
    <div class="card">
      <div class="card-header">
        <span class="emoji">⚖️</span>
        <span class="card-title">体重管理</span>
        <button class="card-action" onclick="editWeightGoal()">🎯 设目标</button>
        <button class="card-action" onclick="addWeight()">+ 录入</button>
      </div>
      <div class="grid-2">
        <div class="mini-card">
          <div class="ic ic-pink">📍</div>
          <div><div class="v">${latest ? latest.value : '--'} <span style="font-size:12px;">kg</span></div><div class="l">最新体重</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ic-blue">🎯</div>
          <div><div class="v">${DATA.weightGoal} <span style="font-size:12px;">kg</span></div><div class="l">目标体重</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ${parseFloat(change)<0?'ic-green':'ic-orange'}">📉</div>
          <div><div class="v">${change>0?'+':''}${change} kg</div><div class="l">累计变化</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ${parseFloat(diff)<=0?'ic-green':'ic-orange'}">📏</div>
          <div><div class="v">${diff>0?'+':''}${diff} kg</div><div class="l">距目标</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📈</span>
        <span class="card-title">体重趋势</span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:120px;">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFC9CF" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#FFC9CF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${path ? `<path d="${path} L ${points[points.length-1].x},${h-pad} L ${points[0].x},${h-pad} Z" fill="url(#lg)"/>` : ''}
        ${path ? `<path d="${path}" fill="none" stroke="#F47281" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#F47281" stroke-width="2"/>`).join('')}
        <line x1="${pad}" y1="${h-pad-(DATA.weightGoal-Math.min(...ws.map(x=>x.value),DATA.weightGoal)+0.5)/(Math.max(...ws.map(x=>x.value),DATA.weightGoal)-Math.min(...ws.map(x=>x.value),DATA.weightGoal)+1)*(h-pad*2)}" x2="${w-pad}" y2="${h-pad-(DATA.weightGoal-Math.min(...ws.map(x=>x.value),DATA.weightGoal)+0.5)/(Math.max(...ws.map(x=>x.value),DATA.weightGoal)-Math.min(...ws.map(x=>x.value),DATA.weightGoal)+1)*(h-pad*2)}" stroke="#7AA8E0" stroke-dasharray="3 3" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📅</span>
        <span class="card-title">历史台账</span>
      </div>
      <div class="timeline">
        ${[...ws].reverse().map(w => `
          <div class="timeline-item">
            <div class="ti-date">${w.date}</div>
            <div class="ti-title">${w.value} kg</div>
            <div class="ti-sub">距目标 ${(w.value - DATA.weightGoal).toFixed(1)} kg</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

        `).join('')}
      </div>

  `;

function daysUntil(dateStr) {
  const t = new Date(dateStr);
  const now = new Date();
  const d1 = new Date(now.getFullYear(), t.getMonth(), t.getDate());
  if (d1 < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
    d1.setFullYear(d1.getFullYear() + 1);
  }
  return Math.ceil((d1 - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
}
function ageText(dateStr) {
  const t = new Date(dateStr);
  const now = new Date();
  let y = now.getFullYear() - t.getFullYear();
  if (now.getMonth() < t.getMonth() || (now.getMonth() === t.getMonth() && now.getDate() < t.getDate())) y--;
  return `第 ${Math.max(0,y)} 年`;
}

      <select class="select" id="cr-type">
        <option>体重</option><option>疫苗</option><option>驱虫</option>
        <option>体检</option><option>饮食</option><option>趣事</option><option>其他</option>
      </select>
    </div>
    <textarea class="input" id="cr-text" rows="2" placeholder="详细内容..."></textarea>
  `, () => {
    const date = document.getElementById('cr-date').value;
    const type = document.getElementById('cr-type').value;
    const text = document.getElementById('cr-text').value.trim();
    if (!date || !text) return false;
    DATA.cat.records.push({ id: uid(), date, type, text });

  });
}
function delCatRec(id) {
  if (!confirm('删除此条记录？')) return;
  DATA.cat.records = DATA.cat.records.filter(r => r.id !== id);
  save(); renderMain();
}

/* ============================================================
   6. 雅思英语学习
============================================================ */
// 词库 IELTS_WORDS_ALL (3000词) 和文章库 IELTS_ARTICLES_ALL (100篇) 来自 ielts_data.js


// 用 mulberry32 生成确定性随机，保证同一 seq 产生相同单词组，刷新时 seq 变化才换词
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed >>> 0;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getTodayIelts() {
  const today = fmtDate(Date.now());
  // 新的一天：记入历史 & 学习天数 +1
  if (DATA.ielts.lastDate !== today) {
    DATA.ielts.lastDate = today;
    if (DATA.ielts.history.findIndex(h => h.date === today) === -1) {
      DATA.ielts.learnedDays += 1;
    }
  }
  // 单词：按 wordSeq 生成（如未生成）
  if (!DATA.ielts.todayWords || DATA.ielts.todayWords._seq !== DATA.ielts.wordSeq) {
    const ws = DATA.ielts.wordSeq || 0;
    const shuffled = seededShuffle(IELTS_WORDS_ALL, ws * 7919 + 7);
    const picked = shuffled.slice(0, 30);
    picked._seq = ws;
    DATA.ielts.todayWords = picked;
  }
  // 文章：按 articleSeq 轮换
  if (!DATA.ielts.todayArticle || DATA.ielts.todayArticle._seq !== DATA.ielts.articleSeq) {
    const as = DATA.ielts.articleSeq || 0;
    const article = IELTS_ARTICLES_ALL[Math.abs(as) % IELTS_ARTICLES_ALL.length];
    article._seq = as;
    DATA.ielts.todayArticle = article;
    // 记入今日历史
    const idx = DATA.ielts.history.findIndex(h => h.date === today);
    if (idx === -1) {
      DATA.ielts.history.unshift({ date: today, article: article.title });
    } else {
      DATA.ielts.history[idx].article = article.title;
    }
  }
  save();
  return { words: DATA.ielts.todayWords, article: DATA.ielts.todayArticle };
}

function viewIelts() {
  const { words, article } = getTodayIelts();
  const learned = DATA.ielts.learnedDays;
  const wordTotal = IELTS_WORDS_ALL.length;
  const artTotal = IELTS_ARTICLES_ALL.length;
  return `
    <div class="card">
      <div class="card-header">
        <span class="emoji">📚</span>
        <span class="card-title">今日学习</span>
      </div>
      <div class="grid-2">
        <div class="mini-card">
          <div class="ic ic-pink">🔥</div>
          <div><div class="v">${learned}</div><div class="l">累计学习天数</div></div>
        </div>
        <div class="mini-card">
          <div class="ic ic-blue">📅</div>
          <div><div class="v">${DATA.ielts.lastDate.slice(5)}</div><div class="l">今日日期</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📝</span>
        <span class="card-title">雅思高频 30 词</span>
        <button class="card-action" onclick="refreshWords()">🔄 换单词</button>
      </div>
      <div class="sub-line" style="margin-bottom:8px;">词库共 ${wordTotal} 词 · 第 ${(DATA.ielts.wordSeq||0)+1} 组</div>
      ${words.map(w => `
        <div class="word-item">
          <span class="w">${w.w}</span><span class="p">${w.p}</span><span class="pos">${w.pos}</span>
          <div class="mean">${w.m}</div>
          <div class="col">${w.col}</div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">📖</span>
        <span class="card-title">今日文章 · 雅思语境</span>
        <button class="card-action" onclick="refreshArticle()">🔄 换文章</button>
      </div>
      <div class="sub-line" style="margin-bottom:8px;">文章库共 ${artTotal} 篇 · 第 ${(DATA.ielts.articleSeq||0)+1} 篇</div>
      <div class="article">
        <h4>${article.title}</h4>
        ${article.title_cn ? `<div class="sub-line" style="margin-bottom:10px; font-size:13px;">${article.title_cn}</div>` : ''}
        ${article.body.split('\n').map((p, i) => {
          if (!p.trim()) return '';
          const cnParas = article.body_cn ? article.body_cn.split('\n') : [];
          const cn = cnParas[i] ? cnParas[i].trim() : '';
          return `<p>${p}</p>${cn ? `<p class="cn-trans">${cn}</p>` : ''}`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="emoji">🗂️</span>
        <span class="card-title">学习记录</span>
      </div>
      <div class="timeline">
        ${DATA.ielts.history.slice(0, 10).map(h => `
          <div class="timeline-item">
            <div class="ti-date">${h.date}</div>
            <div class="ti-title">${h.article}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function bindIelts() {}
function refreshWords() {
  DATA.ielts.wordSeq = (DATA.ielts.wordSeq || 0) + 1;
  DATA.ielts.todayWords = null;  // 强制重新生成
  save();
  renderMain();
}
function refreshArticle() {
  DATA.ielts.articleSeq = (DATA.ielts.articleSeq || 0) + 1;
  DATA.ielts.todayArticle = null;  // 强制重新生成
  save();
  renderMain();
}

/* ============================================================
   弹窗工具
============================================================ */
let modalOnOk = null;
function openModal(title, html, onOk) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  modalOnOk = onOk;
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  modalOnOk = null;
}
document.getElementById('modalOk').onclick = () => {
  if (modalOnOk && modalOnOk() !== false) {
    closeModal();
  }
};
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

============================================================ */
function updateDate() {
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayDate').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${w}`;
}

updateDate();
renderSidebar();
renderMain();
